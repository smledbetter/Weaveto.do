# fly.toml app configuration file for weaveto-relay.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Scaling posture: exactly one always-on machine. See docs/DEPLOYMENT.md.
#
# The relay keeps every room in one in-process Map (server/relay.ts). Nothing is
# persisted and nothing is shared between processes, so the room table is the
# lifetime of the process that holds it. Two consequences follow, and both are
# config decisions rather than preferences:
#
#   1. The machine cannot be allowed to stop. Stopping it destroys every live
#      room, disconnecting members mid-session.
#   2. The app cannot be allowed to run more than one machine. Fly balances
#      connections across machines, so two members of the same room can land on
#      different processes, each holding half a room, unable to see each other.
#      Routing by room ID would lift this, and it is not implemented.
#
# fly.toml cannot cap the machine count on its own. Keep the count at one with
# `fly scale count 1`, and see docs/DEPLOYMENT.md before raising it.

app = 'weaveto-relay'
primary_region = 'ord'

[build]
  dockerfile = 'server/Dockerfile'

# One service definition, not two. This file previously declared both
# [http_service] and a [[services]] block for the same internal port 3001, so
# two service definitions claimed ports 80 and 443. [http_service] is the
# current form and terminates TLS and passes WebSocket upgrades through.
[http_service]
  internal_port = 3001
  force_https = true

  # Rooms live in process memory, so a stopped machine is a mass disconnect.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Catches a relay that died or wedged. It cannot catch a stale build: the
  # relay answers any unmatched path with 200 "OK", so a pre-VAPID image passes
  # this check too. Proving the image is current requires reading the body,
  # which is what scripts/verify-relay-container.mjs does.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/vapid-key'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
